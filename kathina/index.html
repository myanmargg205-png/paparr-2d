<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ကထိန်အလှူမှတ်တမ်း | ကိုကျော်ရေ</title> <meta name="description" content="ကိုကျော်ရေ — ကထိန်အလှူမှတ်တမ်း ဗီဒီယိုများ: ကထိန်၊ အိုးစည်ဝိုင်း အကအခုန်၊ တရားနာ ရေစက်ချ။ BoThu Creations"> <meta name="keywords" content="ကိုကျော်ရေ, ကထိန်အလှူမှတ်တမ်း, ကထိန်, အိုးစည်ဝိုင်း, တရားနာ, BoThu Creations"> <meta property="og:title" content="ကထိန်အလှူမှတ်တမ်း | ကိုကျော်ရေ"> <meta property="og:description" content="ကိုကျော်ရေ — ကထိန်အလှူ ဗီဒီယို ၃ ခု ကြည့်ရှုရန်"> <meta property="og:type" content="website"> <meta property="og:url" content="https://myanmargg205-png.github.io/paparr-2d/kathina/"> <meta property="og:image" content="https://myanmargg205-png.github.io/paparr-2d/kathina/bothu_logo.png"> <meta name="google-site-verification" content="GP7jOGrVfLW9K--zhGE1Z-_KS-5vH-Gx8esVuK1_0J0" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:"Noto Sans Myanmar","Pyidaungsu",sans-serif; background:#FBF6EC; color:#3A2E1B; display:flex; flex-direction:column; overflow:hidden; }
  header { background:linear-gradient(160deg,#FFFDF6,#F5E7C8); border-bottom:2px solid #C69A4A; padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header .logo { width:40px; height:40px; border-radius:50%; border:2px solid #C69A4A; object-fit:cover; background:#fff; }
  header .htext { flex:1; min-width:0; }
  header h1 { font-size:18.5px; color:#7A5A14; line-height:1.25; }
  header .chan { font-size:11.5px; color:#97834F; }
  .tabs { display:flex; background:#FFF8E7; border-bottom:2px solid #C69A4A; }
  .tabs button { flex:1; appearance:none; border:0; background:transparent; padding:11px 4px; font-family:inherit; font-size:15.5px; font-weight:700; color:#8A6D2F; border-bottom:3px solid transparent; cursor:pointer; }
  .tabs button.active { color:#7A5A14; border-bottom-color:#C69A4A; background:#FFFDF6; }
  main { flex:1; display:flex; flex-direction:column; padding:12px 14px; max-width:680px; width:100%; margin:0 auto; min-height:0; }
  .playerbox { background:#000; border-radius:12px; overflow:hidden; box-shadow:0 2px 10px rgba(122,90,20,.15); }
  .playerbox .ratio { position:relative; padding-top:56.25%; }
  .playerbox iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .playerbox .thumb { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .playov { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .playov span { background:rgba(0,0,0,.55); color:#fff; font-size:19px; font-weight:700; padding:13px 24px; border-radius:999px; }
  .vtitle { margin-top:12px; font-size:17.5px; font-weight:700; color:#4A3812; line-height:1.4; }
  .vsub { margin-top:3px; font-size:12.5px; color:#97834F; }
  .openbtn { display:block; margin-top:12px; text-align:center; background:#C69A4A; color:#fff; font-weight:700; font-size:15px; padding:12px; border-radius:10px; text-decoration:none; }
  .openbtn:active { opacity:.85; }
  .dlbtn { display:block; background:#22A355; color:#fff; text-align:center; font-weight:700; font-size:15px; padding:11px; text-decoration:none; }
  .dlbtn:active { opacity:.85; }
  footer { text-align:center; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); font-size:12px; color:#A68D55; border-top:1px solid #EADFC0; background:#FFFDF6; }
</style>
</head>
<body>
<header>
  <img class="logo" src="bothu_logo.png" alt="" onerror="this.style.display='none'">
  <div class="htext">
    <h1>ကထိန်အလှူမှတ်တမ်း</h1>
    <div class="chan">BoThu Creations • YouTube</div>
  </div>
</header>
<a class="dlbtn" id="dlbtn" href="./KathinaVideo.apk" download>QR မလို app ဖြင့် တိုက်ရိုက် ဖွင့်ရန်</a>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="playerbox"><div class="ratio" id="ratiobox"></div></div>
  <div class="vtitle" id="vtitle"></div>
  <div class="vsub" id="vsub"></div>
  <a class="openbtn" id="openbtn" href="#" target="_blank" rel="noopener">YouTube မှာ ဖွင့်ရန်</a>
</main>

<footer>🙏 သာဓု သာဓု သာဓု 🙏</footer>

<script>
 
const VIDEOS = [
  { tab: "ကထိန်", title: "ကထိန်အလှူမှတ်တမ်း", dur: "57:24", yt: "rtyk2yB3wEE", drive: "1iK576G_D8k94uBmnRSb6DxALknJpyZ4I" },
  { tab: "အိုးစည်ဝိုင်း", title: "အိုးစည်ဝိုင်း - အကအခုန်", dur: "30:31", yt: "LzxpafJ-KlA", drive: "19_MhrQnDC7F9TEArt45qgE3nmBuV5qYj"  },
    { tab: "တရားနာ", title: "တရားနာ ရေစက်ချ နှင့် ဝတ္ထုငွေများ ဆပ်ကပ် လှူဒါန်းခြင်း", dur: "26:28", yt: "tMjEhP3QxDs", drive: "15MrblphiTEhWHXjkYkapHzoz8giyO1Es" },
];
function hasYt(v) { return v.yt && !v.yt.startsWith("__"); }
function embedUrl(v, autoplay) {
  if (hasYt(v)) return "https://www.youtube.com/embed/" + v.yt + "?rel=0" + (autoplay ? "&autoplay=1" : "");
  return "https://drive.google.com/file/d/" + v.drive + "/preview";
}
function watchUrl(v) {
  return hasYt(v) ? "https://www.youtube.com/watch?v=" + v.yt
                  : "https://drive.google.com/file/d/" + v.drive + "/view";
}
const tabsEl = document.getElementById('tabs');
const ratiobox = document.getElementById('ratiobox');
const IN_APP = !!window.AndroidOpen;
const vtitle = document.getElementById('vtitle');
const vsub = document.getElementById('vsub');
const openbtn = document.getElementById('openbtn');
let current = -1;
function select(i, autoplay) {
  if (i === current) return;
  current = i;
  const v = VIDEOS[i];
  [...tabsEl.children].forEach((b, j) => b.classList.toggle('active', j === i));
  if (IN_APP && hasYt(v)) {
    ratiobox.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = 'https://i.ytimg.com/vi/' + v.yt + '/hqdefault.jpg';
    const a = document.createElement('a');
    a.className = 'playov';
    a.href = watchUrl(v);
    a.innerHTML = '<span>▶ ကြည့်ရန်</span>';
    ratiobox.appendChild(img);
    ratiobox.appendChild(a);
  } else {
    let fr = ratiobox.querySelector('iframe');
    if (!fr) {
      ratiobox.innerHTML = '';
      fr = document.createElement('iframe');
      fr.id = 'player';
      fr.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
      fr.setAttribute('allowfullscreen', '');
      fr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      ratiobox.appendChild(fr);
    }
    fr.src = embedUrl(v, autoplay);
  }
  vtitle.textContent = v.title;
  vsub.textContent = "BoThu Creations • ကြာချိန် " + v.dur;
  openbtn.href = watchUrl(v);
  openbtn.textContent = hasYt(v) ? "YouTube မှာ ဖွင့်ရန်" : "Drive မှာ ဖွင့်ရန်";
}
VIDEOS.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = v.tab;
  b.addEventListener('click', () => select(i, true));
  tabsEl.appendChild(b);
});
select(0, false);
 // In the app the thumbnail button already opens YouTube — hide the extra button.
 if (IN_APP) openbtn.style.display = 'none'; 
(function () {
  var dl = document.getElementById('dlbtn');
  if (!dl) return;
  if (window.AndroidOpen || /; wv\)/.test(navigator.userAgent) || /[?&]app=1/.test(location.search)) { dl.style.display = 'none'; return; }
  if (window.Telegram && Telegram.WebApp) {
    dl.addEventListener('click', function (e) {
      e.preventDefault();
      Telegram.WebApp.openLink(new URL(dl.getAttribute('href'), location.href).href);
    });
  }
})();
</script>
</body>
</html>
