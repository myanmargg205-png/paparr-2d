name: Fetch Tuborg 2D Data

on:
  workflow_dispatch:
  schedule:
    # Myanmar time (UTC+6:30): run from 08:00 to 16:20
    - cron: "30,40,50 1 * * *"
    - cron: "*/10 2-9 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Myanmar API window
        id: window
        run: |
          NOW=$(TZ=Asia/Yangon date +%H%M)
          HOUR=$((10#${NOW:0:2}))
          MINUTE=$((10#${NOW:2:2}))
          TOTAL=$((HOUR * 60 + MINUTE))
          if [ "$TOTAL" -ge 480 ] && [ "$TOTAL" -lt 990 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Outside Myanmar API window; skipping API request."
          fi

      - name: Fetch Tuborg data
        if: steps.window.outputs.allowed == 'true'
        run: |
          set -eu

          curl -fsS --max-time 30 \
            "https://tuborg2d.com/api.php" \
            -o /tmp/tuborg.json

          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("/tmp/tuborg.json")
          data = json.loads(source.read_text())

          if data.get("success") is not True:
              raise SystemExit("Tuborg API did not return success=true")

          Path("data").mkdir(exist_ok=True)
          Path("data/tuborg-results.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          )

          print("Tuborg JSON received and validated.")
          PY

      - name: Save updated data
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tuborg-results.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Tuborg 2D data"
            git push
          fi
