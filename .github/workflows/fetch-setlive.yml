name: Fetch SetLive Results

on:
  workflow_dispatch:
  schedule:
    # Myanmar time (UTC+6:30): run from 08:00 to 16:20
    - cron: "30,40,50 1 * * *"
    - cron: "*/10 2-9 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Myanmar API window
        id: window
        run: |
          NOW=$(TZ=Asia/Yangon date +%H%M)
          HOUR=$((10#${NOW:0:2}))
          MINUTE=$((10#${NOW:2:2}))
          TOTAL=$((HOUR * 60 + MINUTE))
          if [ "$TOTAL" -ge 480 ] && [ "$TOTAL" -lt 990 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Outside Myanmar API window; skipping API request."
          fi

      - name: Fetch SetLive data
        if: steps.window.outputs.allowed == 'true'
        env:
          SETLIVE_API_KEY: ${{ secrets.SETLIVE_API_KEY }}
        run: |
          set -eu

          HTTP_CODE=$(curl -sS \
            --max-time 20 \
            -o /tmp/setlive.json \
            -w '%{http_code}' \
            -H "X-API-Key: $SETLIVE_API_KEY" \
            "https://setlive.myanmarnode.com/api/v1/twod-result-live")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SetLive API returned HTTP $HTTP_CODE"
            exit 1
          fi

          mkdir -p data
          python -m json.tool /tmp/setlive.json > data/setlive-results.json
          echo "SetLive JSON received successfully."

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/setlive-results.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update SetLive results"
            git push
          fi
