<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="နေ့စဉ် 2D ရလဒ်နှင့် ရလဒ်မှတ်တမ်း">
  <title>Paparr 2D</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #080d19;
      --card: rgba(20, 30, 51, .92);
      --border: rgba(91, 125, 177, .3);
      --blue: #59aaff;
      --cyan: #35e0ff;
      --green: #00ffad;
      --muted: #aabbd5;
    }

    body {
      margin: 0;
      padding: 18px 14px 24px;
      font-family: system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, #193967 0%, transparent 52%),
        linear-gradient(160deg, #080d19, #10182b 55%, #080d19);
      background-attachment: fixed;
      color: #f4f8ff;
      min-height: 100vh;
    }

    .wrap { max-width: 520px; margin: auto; }

    header {
      text-align: center;
      padding: 22px 12px 18px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 36px);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, #67caff, #00ffad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 12px rgba(53, 224, 255, .2));
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(24, 38, 64, .97), rgba(14, 22, 39, .97));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      margin: 16px 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .24),
                  inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .card::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #40cfff, #00ffad, transparent);
      opacity: .65;
    }

    h2, h3 { color: #eef6ff; }

    .label {
      color: #c7d9f5;
      text-align: center;
      font-weight: 800;
    }

    #latest {
      text-align: center;
      font-size: clamp(64px, 18vw, 84px);
      line-height: 1.15;
      font-weight: 950;
      color: var(--green);
      padding: 14px 0;
      letter-spacing: 7px;
      text-shadow: 0 0 12px rgba(0, 255, 173, .45),
                   0 0 34px rgba(0, 255, 173, .16);
      animation: livePulse 1.4s ease-in-out infinite alternate;
    }

    #liveSet {
      color: var(--cyan);
      font-weight: 850;
      text-shadow: 0 0 10px rgba(53, 224, 255, .3);
    }

    #liveVal {
      color: #ffdc69;
      font-weight: 850;
      text-shadow: 0 0 10px rgba(255, 220, 105, .24);
    }

    button, input {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid var(--border);
      font-size: 16px;
    }

    button {
      background: linear-gradient(110deg, #2677ff, #25bfff);
      color: white;
      border: 0;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(38, 119, 255, .22);
      transition: filter .2s, transform .2s;
    }

    button:active { transform: scale(.98); }
    button:hover { filter: brightness(1.1); }

    input {
      background: #0b1221;
      color: white;
      margin: 10px 0;
    }

    .row { display: flex; gap: 10px; }
    .row button { flex: 1; min-width: 0; }

    #status {
      text-align: center;
      font-size: 14px;
      color: #c7d9f5;
      padding: 12px 10px;
      border: 1px solid rgba(91, 125, 177, .22);
      border-radius: 12px;
      background: rgba(8, 14, 27, .65);
      overflow-wrap: anywhere;
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 2px;
      border-bottom: 1px solid rgba(91, 125, 177, .2);
      color: #dce8fb;
    }

    .result:last-child { border-bottom: 0; }

    .number {
      color: #83baff;
      font-weight: 900;
      font-size: 21px;
      font-variant-numeric: tabular-nums;
    }

    hr {
      border: 0;
      height: 1px;
      margin: 18px 0;
      background: linear-gradient(90deg, transparent, #425c80, transparent);
    }

    footer {
      text-align: center;
      color: #8598b8;
      font-size: 12px;
      padding: 20px 0;
    }

    @keyframes numberChange {
      0% { opacity: .35; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .number-change { animation: numberChange .35s ease-out; }

    @keyframes livePulse {
      from { opacity: .82; transform: scale(1); }
      to { opacity: 1; transform: scale(1.025); }
    }

    @media (max-width: 360px) {
      body { padding: 12px 10px; }
      .card { padding: 16px; border-radius: 18px; }
      .result { gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #latest { animation: none; }
      .number-change { animation: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 Paparr 2D</h1>
    <p class="muted">နေ့စဉ် 2D ရလဒ်နှင့် မှတ်တမ်း</p>
  </header>

  <section class="card">
    <p class="label">Live 2D</p>
    <div id="latest">--</div>
    <div style="display:flex;justify-content:space-around;gap:12px;margin:15px 0">
      <div>
        <p class="label">SET</p>
        <div id="liveSet" class="number">--</div>
      </div>
      <div>
        <p class="label">VAL</p>
        <div id="liveVal" class="number">--</div>
      </div>
    </div>
    <p class="label" id="latestTime">Live ဒေတာရယူနေသည်...</p>

    <p id="status" class="muted">ချိတ်ဆက်နေသည်...</p>
  </section>

  <section class="card">
    <h3>📊 သတ်မှတ်ချိန် ရလဒ်များ</h3>

    <p class="label">12:01 PM</p>
    <div class="result">
      <span>SET</span>
      <span class="number" id="setResult1201">--</span>
    </div>
    <div class="result">
      <span>VAL</span>
      <span class="number" id="valResult1201">--</span>
    </div>
    <div class="result">
      <span>2D</span>
      <span class="number" id="result1201">--</span>
    </div>

    <hr>

    <p class="label">04:30 PM</p>
    <div class="result">
      <span>SET</span>
      <span class="number" id="setResult1630">--</span>
    </div>
    <div class="result">
      <span>VAL</span>
      <span class="number" id="valResult1630">--</span>
    </div>
    <div class="result">
      <span>2D</span>
      <span class="number" id="result1630">--</span>
    </div>
  </section>

  <footer>
    ရလဒ်အချက်အလက်များကို ပြသရန်အတွက်သာ ဖြစ်သည်။<br>
    Paparr 2D
  </footer>
</div>

<script>
const RESULT_URL =
  "https://raw.githubusercontent.com/2dmyanmarteam-droid/myanmar-2d-live/main/data/results.json";
const LIVE_URL = "https://api.thaistock2d.com/live";

const $ = id => document.getElementById(id);
function validNumber(value) {
  if (value === null || value === undefined) return "--";
  const s = String(value).trim();
  return /^\d{1,2}$/.test(s) ? s.padStart(2, "0") : "--";
}







function setAnimatedText(id, value) {
  const el = $(id);
  const next = String(value ?? "--");
  if (el.textContent === next) return;
  el.textContent = next;
  el.classList.remove("number-change");
  void el.offsetWidth;
  el.classList.add("number-change");
}

function getLive2D(setValue, valValue) {
  const setText = String(setValue || "").replace(/,/g, "");
  const valText = String(valValue || "").replace(/,/g, "");
  const setMatch = setText.match(/\.(\d+)/);
  const valMatch = valText.match(/^(\d+)/);
  if (!setMatch || !valMatch) return "--";
  return setMatch[1].slice(-1) + valMatch[1].slice(-1);
}


async function loadLive() {
  try {
    const response = await fetch(LIVE_URL, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    const live = data.live || {};
    const results = Array.isArray(data.result) ? data.result : [];
    const today = String(live.date || "").slice(0, 10);
    const liveSet = live.set || "--";
    const liveVal = live.value || "--";
    const liveNumber = getLive2D(liveSet, liveVal);

    setAnimatedText("liveSet", liveSet);
    setAnimatedText("liveVal", liveVal);

    const confirmedFor = (time) => results.find(item =>
      item &&
      String(item.open_time || "").startsWith(time) &&
      String(item.stock_date || "").slice(0, 10) === today &&
      /^\d{2}$/.test(String(item.twod || ""))
    );

    const morning = confirmedFor("12:01");
    const evening = confirmedFor("16:30");
    const key = "paparr2d-freeze-" + today;
    let saved = {};

    try {
      saved = JSON.parse(localStorage.getItem(key) || "{}");
    } catch (_) {
      saved = {};
    }

    const valid = value =>
      value != null && String(value).trim() !== "" &&
      String(value) !== "--";

    if (!morning && valid(liveSet) && valid(liveVal) &&
        !saved.morningFinal) {
      saved.morningLive = { set: liveSet, val: liveVal };
    }

    if (morning && !saved.morningFinal) {
      const previous = saved.morningLive || {};
      saved.morningFinal = {
        set: valid(morning.set) ? morning.set :
             (previous.set || liveSet),
        val: valid(morning.value) ? morning.value :
             (previous.val || liveVal),
        twod: String(morning.twod)
      };
    }

    if (saved.morningFinal) {
      setAnimatedText("setResult1201", saved.morningFinal.set);
      setAnimatedText("valResult1201", saved.morningFinal.val);
      setAnimatedText("result1201", saved.morningFinal.twod);
    } else {
      const previous = saved.morningLive || {};
      setAnimatedText("setResult1201", previous.set || liveSet);
      setAnimatedText("valResult1201", previous.val || liveVal);
      setAnimatedText("result1201", getLive2D(previous.set || liveSet, previous.val || liveVal));
    }

    if (!evening && valid(liveSet) && valid(liveVal) &&
        !saved.eveningFinal) {
      saved.eveningLive = { set: liveSet, val: liveVal };
    }

    if (evening && !saved.eveningFinal) {
      const previous = saved.eveningLive || {};
      saved.eveningFinal = {
        set: valid(evening.set) ? evening.set :
             (previous.set || liveSet),
        val: valid(evening.value) ? evening.value :
             (previous.val || liveVal),
        twod: String(evening.twod)
      };
    }

    if (saved.eveningFinal) {
      setAnimatedText("setResult1630", saved.eveningFinal.set);
      setAnimatedText("valResult1630", saved.eveningFinal.val);
      setAnimatedText("result1630", saved.eveningFinal.twod);
    } else {
      setAnimatedText("setResult1630", "--");
      setAnimatedText("valResult1630", "--");
      setAnimatedText("result1630", "--");
    }

    try {
      localStorage.setItem(key, JSON.stringify(saved));
    } catch (error) {
      console.log("Snapshot save:", error);
    }

    if (saved.eveningFinal) {
      setAnimatedText("liveSet", saved.eveningFinal.set);
      setAnimatedText("liveVal", saved.eveningFinal.val);
      setAnimatedText("latest", saved.eveningFinal.twod);
      $("latestTime").textContent = "နေ့တာပြီးဆုံး · 04:30 PM";
      $("status").textContent = "🔒 ယနေ့ Live ရပ်ထားပါပြီ";
    } else {
      setAnimatedText("latest", liveNumber);
      $("latestTime").textContent =
        "Live 2D · " + (live.time || "အချိန်မသိရသေးပါ");
      $("status").textContent = "✅ Live ဒေတာ ရရှိပါပြီ";
    }
  } catch (error) {
    console.error("Live API:", error);
    $("status").textContent = "⚠️ Live ဒေတာ ရယူမရပါ";
  }
}

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.log("Service worker:", error));
  });
}

loadLive();

setInterval(loadLive, 5000);
</script>
</body>
</html>
